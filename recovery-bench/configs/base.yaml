# recovery-bench — full configuration
# Schema: docs/CONFIG.md   Rationale: docs/DECISIONS.md
# Nothing here is duplicated in source. This file IS the experiment.

run:
  name: full_grid
  seed: 20260926          # D0: the original never set one
  resume: true
  dry_run: false
  # Concurrent cells per provider. NVIDIA returns HTTP 200 with an EMPTY BODY
  # past its 16/16 worker limit rather than a 429 (D20), which a sweep would
  # record as the model saying nothing. The worker pool, not RPM, is the limit:
  # four keys raise the request ceiling but not the pool, so 4 in flight stays
  # the right number. gemini's quota is 30 calls total, so serialise it.
  default_concurrency: 2
  concurrency:
    nvidia: 4
    gemini: 1
    qwencloud: 2

# ---------------------------------------------------------------- providers
# api_key_env holds VARIABLE NAMES ONLY. Values stay in .env.local.
providers:
  nvidia:
    kind: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: [NVIDIA_KEY_1, NVIDIA_KEY_2, NVIDIA_KEY_3, NVIDIA_KEY_4]  # key pool
    # 300. Set from MEASURED latency, after 180 was tried and refuted.
    #
    # Seven successful muse_30b calls on failure_pool, 25 Oct 2026 (ms):
    #   prompt 29,555 -> 80,498 / 96,996 / 140,379 / 152,930
    #   prompt    899 -> 121,074 / 129,588 / 154,313
    #
    # Two things follow. Latency is NOT driven by prompt size — a 899-token
    # prompt took as long as a 29,555-token one — so it is queueing on the free
    # tier, which no amount of prompt trimming will fix. And the observed
    # maximum is 154 s, so a 180 s ceiling sits barely above the distribution:
    # at 180 s, 4 of the first 10 cells timed out (40%), against 0 of a5's 720
    # cells at 300 s. 180 was cutting off calls that would have succeeded.
    timeout_s: 300
    # 2, not 4. Retries are OPERATIONAL, not experimental: the model sees the
    # same prompt, and a cell that exhausts them is excluded from analysis by
    # `measuresModel: false` either way. Fewer retries changes how long we wait
    # before recording that, not what is measured.
    max_retries: 2

  qwencloud:
    kind: openai_compat
    base_url: https://maas.qwencloudapi.com/compatible-mode/v1
    api_key_env: qwen_api_key
    # 300. Set from MEASURED latency, after 180 was tried and refuted.
    #
    # Seven successful muse_30b calls on failure_pool, 25 Oct 2026 (ms):
    #   prompt 29,555 -> 80,498 / 96,996 / 140,379 / 152,930
    #   prompt    899 -> 121,074 / 129,588 / 154,313
    #
    # Two things follow. Latency is NOT driven by prompt size — a 899-token
    # prompt took as long as a 29,555-token one — so it is queueing on the free
    # tier, which no amount of prompt trimming will fix. And the observed
    # maximum is 154 s, so a 180 s ceiling sits barely above the distribution:
    # at 180 s, 4 of the first 10 cells timed out (40%), against 0 of a5's 720
    # cells at 300 s. 180 was cutting off calls that would have succeeded.
    timeout_s: 300
    # 2, not 4. Retries are OPERATIONAL, not experimental: the model sees the
    # same prompt, and a cell that exhausts them is excluded from analysis by
    # `measuresModel: false` either way. Fewer retries changes how long we wait
    # before recording that, not what is measured.
    max_retries: 2

  gemini:
    kind: gemini
    # Two keys, pooled. NOT declared per_key in the budget below: Gemini's free
    # tier is quota'd per PROJECT, so two keys from one Google Cloud project
    # share one allowance. Pooling still buys retry headroom against a single
    # key's rate limit; it does not buy a second token ceiling unless the keys
    # really are separate projects (D28's test applies here too).
    api_key_env: [gemini_api_key, gemini_api_key1]
    # 300. Set from MEASURED latency, after 180 was tried and refuted.
    #
    # Seven successful muse_30b calls on failure_pool, 25 Oct 2026 (ms):
    #   prompt 29,555 -> 80,498 / 96,996 / 140,379 / 152,930
    #   prompt    899 -> 121,074 / 129,588 / 154,313
    #
    # Two things follow. Latency is NOT driven by prompt size — a 899-token
    # prompt took as long as a 29,555-token one — so it is queueing on the free
    # tier, which no amount of prompt trimming will fix. And the observed
    # maximum is 154 s, so a 180 s ceiling sits barely above the distribution:
    # at 180 s, 4 of the first 10 cells timed out (40%), against 0 of a5's 720
    # cells at 300 s. 180 was cutting off calls that would have succeeded.
    timeout_s: 300
    # 2, not 4. Retries are OPERATIONAL, not experimental: the model sees the
    # same prompt, and a cell that exhausts them is excluded from analysis by
    # `measuresModel: false` either way. Fewer retries changes how long we wait
    # before recording that, not what is measured.
    max_retries: 2

# ------------------------------------------------------------------- models
# Measured throughput is recorded for the record; `doctor` re-measures.
models:
  gemini_flash:                       # A1 — replication only
    provider: gemini
    model: gemini-3.6-flash
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    thinking: false
    supports_tools: false

  muse_30b:                           # A2 workhorse — 29.46 TPS, 2.12 s TTFT
    provider: nvidia
    model: meta/muse-glimmer-30b
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    thinking: false
    supports_tools: true

  nemotron_ultra:                     # A3 capability — 164.33 TPS, 1.65 s TTFT
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.0
    top_p: 1.0
    max_tokens: 16384
    thinking: false
    reasoning_budget: null
    supports_tools: false

  nemotron_nano:                      # A4 reasoning — 48.93 TPS, 1.27 s TTFT
    provider: nvidia
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    temperature: 0.0
    top_p: 1.0
    max_tokens: 16384
    thinking: false                   # overridden per-arm in A4
    reasoning_budget: 4096            # D5: NOT the 16384 in the vendor sample
    supports_tools: true

  qwen_max:                           # A6 optional
    provider: qwencloud
    model: qwen3.8-max
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    thinking: false
    supports_tools: true

  # DROPPED (D4) — kept documented so the exclusion is auditable:
  #   z-ai/glm-5-3-flash                    13.24 TPS · 23.99 s TTFT
  #   nvidia/nemotron-3.5-lightning-30b-a3b  9.61 TPS · 65.07 s TTFT
  #   happyhorse-1.1-t2v                     text-to-video, not applicable

# -------------------------------------------------------------------- tasks
tasks:
  dataset: princeton-nlp/SWE-bench_Lite
  split: test
  # Frozen by step 0. The pipeline reads the local file and never touches the
  # network for tasks; `revision` is asserted against data/swebench_lite.meta.json
  # so a re-export from a different upstream commit fails loudly.
  source: data/swebench_lite.jsonl
  revision: 6ec7bb89b9342f664a54a6e0a6ea6501d3437cc2
  expected_rows: 300

  failure_pool:                       # PLAN.md §7 — the 4 genuine logic failures
    selection: explicit
    ids:
      - astropy__astropy-7746
      - django__django-11019
      - django__django-11283
      - django__django-11564

  stratified_60:                      # PLAN.md §8.3 — fixes D5 sampling bias
    selection: stratified
    n: 60
    per_repo_min: 3

  context:
    mode: symbol                      # D7: was whole_file — 31,098 tokens for wcs.py
    padding_lines: 50

# --------------------------------------------------------------------- edit
edit:
  formats: [search_replace, unified_diff]
  fuzzy_match: false

# ------------------------------------------------------------------- verify
verify:
  backend: git_apply                  # D6: the only legal value. No Docker.
  contamination:
    enabled: true
    threshold: 0.95

# ------------------------------------------------------------------- budget
budget:
  estimate_before_run: true
  stop_on_exhaustion: skip_arm
  nvidia:
    # PER KEY, not per provider. The three keys in api_key_env were each created
    # from a separate build.nvidia.com account, so each has its own allowance
    # (D28). NVIDIA_KEY_4 was confirmed by Nakul on 25 Oct 2026 to be a fourth
    # separate account, so effective capacity is 4 x 8M = 32M; the sweep
    # distributes load round-robin and excludes a key once its own ceiling is
    # reached.
    per_key: true
    max_tokens: 8000000                # 8M — YAML 1.2 has no _ separator, so no underscores
    max_calls: 1500
  qwencloud:
    max_tokens: 900000                # under the 1M free quota, deliberately
    max_calls: 100
  gemini:
    max_tokens: 500000
    max_calls: 30                     # ~20/day ceiling

# --------------------------------------------------------------------- grid
grid:
  a1_replication:
    enabled: true
    models: [gemini_flash]
    tasks: failure_pool
    strategies: [l1_blind_retry, l2_reflection, l2_5_diagnose_revise]
    edit_formats: [search_replace]
    thinking: [false]
    rounds: 2                         # stays 2: the pilot ran 2, and a
                                      # replication that changes depth is not
                                      # a replication
    repeats: 1                        # 24 cells

  a2_workhorse:
    enabled: true
    models: [muse_30b]
    tasks: failure_pool
    strategies: [l1_blind_retry, l2_reflection, l2_5_diagnose_revise]
    edit_formats: [search_replace]
    thinking: [false]
    rounds: 4                         # Phase 2: LOST is unreachable below K=4
    repeats: 5                        # 240 cells

  a3_capability:
    enabled: true
    models: [nemotron_ultra]
    tasks: failure_pool
    # l2_5_diagnose_revise dropped — D34. a2 ran it on all four tasks and it
    # refused 80 of 80 cells. It is not measurable without Docker, and 80 rows
    # of PROVIDER_ERROR are not a condition, they are a hole in the table.
    strategies: [l1_blind_retry, l2_reflection]
    edit_formats: [search_replace]
    thinking: [false]
    rounds: 4                         # Phase 2: LOST is unreachable below K=4
    repeats: 5                        # 160 cells + 20 baselines = 180

  a4_reasoning:
    enabled: true
    models: [nemotron_nano]
    tasks: failure_pool
    strategies: [l1_blind_retry, l2_reflection]   # l2_5 dropped — D34
    edit_formats: [search_replace]
    thinking: [false, true]           # the manipulated variable
    rounds: 4                         # Phase 2: LOST is unreachable below K=4
    repeats: 5                        # 320 cells + 40 baselines = 360

  a5_format_at_scale:
    enabled: true
    models: [muse_30b, nemotron_ultra]
    tasks: stratified_60
    strategies: [l0_baseline]
    edit_formats: [unified_diff, search_replace]
    thinking: [false]
    rounds: 1
    repeats: 3                        # 720 cells

  a6_qwencloud:
    enabled: true                     # opted in 25 Oct 2026 — a fourth vendor
                                      # for cross-family robustness. Stays at
                                      # rounds 2: the 1M free quota is finite
                                      # and this arm is a robustness check, not
                                      # where LOST is measured.
    models: [qwen_max]
    tasks: failure_pool
    strategies: [l1_blind_retry, l2_reflection, l2_5_diagnose_revise]
    edit_formats: [search_replace]
    thinking: [false]
    rounds: 2
    # 3 repeats projected 1.03M tokens against the 0.90M ceiling (115%). The
    # ceiling is deliberately under Qwen's 1M free quota, so the overflow is
    # real and not an accounting artefact: cut breadth, not the ceiling (D3).
    repeats: 2                        # 48 cells
