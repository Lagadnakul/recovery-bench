# recovery-bench — full configuration
# Schema: docs/CONFIG.md   Rationale: docs/DECISIONS.md
# Nothing here is duplicated in source. This file IS the experiment.

run:
  name: full_grid
  seed: 20260926          # D0: the original never set one
  resume: true
  dry_run: false
  # Concurrent cells per provider. NVIDIA returns HTTP 200 with an EMPTY BODY
  # past its 16/16 worker limit rather than a 429 (D20), which a sweep would
  # record as the model saying nothing. The worker pool, not RPM, is the limit:
  # four keys raise the request ceiling but not the pool, so 4 in flight stays
  # the right number. gemini's quota is 30 calls total, so serialise it.
  default_concurrency: 2
  concurrency:
    nvidia: 4
    gemini: 1
    qwencloud: 2

# ---------------------------------------------------------------- providers
# api_key_env holds VARIABLE NAMES ONLY. Values stay in .env.local.
providers:
  nvidia:
    kind: openai_compat
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: [NVIDIA_KEY_1, NVIDIA_KEY_2, NVIDIA_KEY_3, NVIDIA_KEY_4,
                  NVIDIA_KEY_5, NVIDIA_KEY_6, NVIDIA_KEY_7]               # key pool
    # 300. Set from MEASURED latency, after 180 was tried and refuted.
    #
    # Seven successful muse_30b calls on failure_pool, 25 Oct 2026 (ms):
    #   prompt 29,555 -> 80,498 / 96,996 / 140,379 / 152,930
    #   prompt    899 -> 121,074 / 129,588 / 154,313
    #
    # Two things follow. Latency is NOT driven by prompt size — a 899-token
    # prompt took as long as a 29,555-token one — so it is queueing on the free
    # tier, which no amount of prompt trimming will fix. And the observed
    # maximum is 154 s, so a 180 s ceiling sits barely above the distribution:
    # at 180 s, 4 of the first 10 cells timed out (40%), against 0 of a5's 720
    # cells at 300 s. 180 was cutting off calls that would have succeeded.
    timeout_s: 300
    # 2, not 4. Retries are OPERATIONAL, not experimental: the model sees the
    # same prompt, and a cell that exhausts them is excluded from analysis by
    # `measuresModel: false` either way. Fewer retries changes how long we wait
    # before recording that, not what is measured.
    max_retries: 2

  qwencloud:
    kind: openai_compat
    base_url: https://maas.qwencloudapi.com/compatible-mode/v1
    api_key_env: qwen_api_key
    # 300. Set from MEASURED latency, after 180 was tried and refuted.
    #
    # Seven successful muse_30b calls on failure_pool, 25 Oct 2026 (ms):
    #   prompt 29,555 -> 80,498 / 96,996 / 140,379 / 152,930
    #   prompt    899 -> 121,074 / 129,588 / 154,313
    #
    # Two things follow. Latency is NOT driven by prompt size — a 899-token
    # prompt took as long as a 29,555-token one — so it is queueing on the free
    # tier, which no amount of prompt trimming will fix. And the observed
    # maximum is 154 s, so a 180 s ceiling sits barely above the distribution:
    # at 180 s, 4 of the first 10 cells timed out (40%), against 0 of a5's 720
    # cells at 300 s. 180 was cutting off calls that would have succeeded.
    timeout_s: 300
    # 2, not 4. Retries are OPERATIONAL, not experimental: the model sees the
    # same prompt, and a cell that exhausts them is excluded from analysis by
    # `measuresModel: false` either way. Fewer retries changes how long we wait
    # before recording that, not what is measured.
    max_retries: 2

  gemini:
    kind: gemini
    # Four keys, pooled. Gemini's free tier is quota'd per PROJECT, so keys
    # from one Google Cloud project share one allowance no matter how many
    # there are. Pooling always buys retry headroom against a single key's
    # rate limit; it buys a second token ceiling only if the keys really are
    # separate projects, which is the same test D28 applied to NVIDIA_KEY_4.
    # See the gemini budget block below for what is being claimed, and D35.
    api_key_env: [gemini_api_key, gemini_api_key1, gemini_api_key2, gemini_api_key3]
    # 300. Set from MEASURED latency, after 180 was tried and refuted.
    #
    # Seven successful muse_30b calls on failure_pool, 25 Oct 2026 (ms):
    #   prompt 29,555 -> 80,498 / 96,996 / 140,379 / 152,930
    #   prompt    899 -> 121,074 / 129,588 / 154,313
    #
    # Two things follow. Latency is NOT driven by prompt size — a 899-token
    # prompt took as long as a 29,555-token one — so it is queueing on the free
    # tier, which no amount of prompt trimming will fix. And the observed
    # maximum is 154 s, so a 180 s ceiling sits barely above the distribution:
    # at 180 s, 4 of the first 10 cells timed out (40%), against 0 of a5's 720
    # cells at 300 s. 180 was cutting off calls that would have succeeded.
    timeout_s: 300
    # 2, not 4. Retries are OPERATIONAL, not experimental: the model sees the
    # same prompt, and a cell that exhausts them is excluded from analysis by
    # `measuresModel: false` either way. Fewer retries changes how long we wait
    # before recording that, not what is measured.
    max_retries: 2

# ------------------------------------------------------------------- models
# Measured throughput is recorded for the record; `doctor` re-measures.
models:
  gemini_flash:                       # A1 — replication only
    provider: gemini
    model: gemini-3.6-flash
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    thinking: false
    supports_tools: false

  muse_30b:                           # A2 workhorse — 29.46 TPS, 2.12 s TTFT
    provider: nvidia
    model: meta/muse-glimmer-30b
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    thinking: false
    supports_tools: true

  nemotron_ultra:                     # A3 capability — 164.33 TPS, 1.65 s TTFT
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    temperature: 0.0
    top_p: 1.0
    max_tokens: 16384
    thinking: false
    reasoning_budget: null
    supports_tools: false

  nemotron_nano:                      # A4 reasoning — 48.93 TPS, 1.27 s TTFT
    provider: nvidia
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    temperature: 0.0
    top_p: 1.0
    max_tokens: 16384
    thinking: false                   # overridden per-arm in A4
    # null in this variant, not 4096. No phase-2 arm sets thinking: true, and
    # the validator refuses a reasoning budget nothing can ever spend (D5).
    # base.yaml keeps 4096 because a4_reasoning is the arm that uses it.
    reasoning_budget: null
    supports_tools: true

  qwen_max:                           # A6 optional
    provider: qwencloud
    model: qwen3.8-max
    temperature: 0.0
    top_p: 1.0
    max_tokens: 8192
    thinking: false
    supports_tools: true

  # DROPPED (D4) — kept documented so the exclusion is auditable:
  #   z-ai/glm-5-3-flash                    13.24 TPS · 23.99 s TTFT
  #   nvidia/nemotron-3.5-lightning-30b-a3b  9.61 TPS · 65.07 s TTFT
  #   happyhorse-1.1-t2v                     text-to-video, not applicable

# -------------------------------------------------------------------- tasks
tasks:
  dataset: princeton-nlp/SWE-bench_Lite
  split: test
  # Frozen by step 0. The pipeline reads the local file and never touches the
  # network for tasks; `revision` is asserted against data/swebench_lite.meta.json
  # so a re-export from a different upstream commit fails loudly.
  source: data/swebench_lite.jsonl
  revision: 6ec7bb89b9342f664a54a6e0a6ea6501d3437cc2
  expected_rows: 300

  failure_pool:                       # PLAN.md §7 — the 4 genuine logic failures
    selection: explicit
    ids:
      - astropy__astropy-7746
      - django__django-11019
      - django__django-11283
      - django__django-11564

  stratified_60:                      # PLAN.md §8.3 — fixes D5 sampling bias
    selection: stratified
    n: 60
    per_repo_min: 3

  # ------------------------------------------------------------------------
  # PHASE 2 — the recovery pools, MEASURED rather than inherited.
  #
  # Every task below is one where that model's `search_replace` baseline
  # genuinely failed over all 300 SWE-bench Lite instances (a5 + a7, 600
  # attempts, 23 failures at 3.8% — D42). BROKEN outcomes are excluded: a
  # provider error measured nothing about the model (D18), so a task cannot
  # enter a recovery pool on the strength of one.
  #
  # The pools are PER MODEL and that is the whole point. The 23 failures are
  # (task, model) pairs, not tasks: only 4 tasks fail on both models, and 6 of
  # the 19 fail only on muse_30b while nemotron_ultra applies cleanly. Pointing
  # one 19-task pool at both models would hand nemotron_ultra 6 tasks it had
  # already solved, and a recovery arm whose baseline already succeeds measures
  # nothing — that is the ceiling effect that refuted the `stratified_60`
  # extension plan before it was run, and the mirror of a4's floor.
  # ------------------------------------------------------------------------

  recovery_pool_ultra:                # 13 tasks nemotron_ultra failed
    selection: explicit
    ids:
      - django__django-11564
      - django__django-15061
      - mwaskom__seaborn-3407
      - psf__requests-1963
      - pydata__xarray-4493
      - pylint-dev__pylint-6506
      - sphinx-doc__sphinx-8435
      - sphinx-doc__sphinx-8627
      - sympy__sympy-12419
      - sympy__sympy-13471
      - sympy__sympy-16792
      - sympy__sympy-18189
      - sympy__sympy-20590

  recovery_pool_muse:                 # 10 tasks muse_30b failed
    selection: explicit
    ids:
      - django__django-11564
      - django__django-13220
      - django__django-15061
      - scikit-learn__scikit-learn-13497
      - sphinx-doc__sphinx-8474
      - sympy__sympy-13146
      - sympy__sympy-13895
      - sympy__sympy-16792
      - sympy__sympy-20590
      - sympy__sympy-23191

  context:
    mode: symbol                      # D7: was whole_file — 31,098 tokens for wcs.py
    padding_lines: 50

# --------------------------------------------------------------------- edit
edit:
  formats: [search_replace, unified_diff]
  fuzzy_match: false

# ------------------------------------------------------------------- verify
verify:
  backend: git_apply                  # D6: the only legal value. No Docker.
  contamination:
    enabled: true
    threshold: 0.95

# ------------------------------------------------------------------- budget
budget:
  estimate_before_run: true
  stop_on_exhaustion: skip_arm
  nvidia:
    # PER KEY, not per provider. The three original keys in api_key_env were
    # each created from a separate build.nvidia.com account, so each has its own
    # allowance (D28). NVIDIA_KEY_4 was confirmed by Nakul on 25 Oct 2026 to be
    # a fourth separate account. KEYS 5-7 were added 26 Oct 2026 and are
    # ASSUMED separate on the same grounds — if they are not, the claimed
    # capacity is wrong, but the failure mode is 429s the pool rotates away
    # from, not money. The sweep distributes load round-robin and excludes a
    # key once its own ceiling is reached.
    per_key: true
    max_tokens: 8000000                # 8M — YAML 1.2 has no _ separator, so no underscores
    max_calls: 1500
  qwencloud:
    max_tokens: 900000                # under the 1M free quota, deliberately
    max_calls: 100
  gemini:
    # PER KEY as of 26 Oct 2026 — D35. Four keys, and a1 needs 28 calls against
    # what was a single 30-call ceiling with 3 already spent. It did not fit.
    #
    # The claim this makes is narrow and must stay narrow: Gemini's free tier is
    # quota'd per PROJECT, so this is only true if the four keys come from four
    # separate Google accounts. Nakul added them for exactly that reason. The
    # per-key ceilings below are unchanged from the single-key values, so
    # nothing is being relaxed per key — only the pool is wider.
    per_key: true
    max_tokens: 500000
    max_calls: 30                     # ~20/day ceiling, PER KEY

# --------------------------------------------------------------------- grid
# ==========================================================================
# PHASE 2 — the recovery arms, on a pool that was measured rather than
# inherited.
#
# ## The defect this exists to fix
#
# a3 found the study's most surprising result: reflection helps once and then
# HARMS, b = 19 / c = 0 of 60 pairs, p = 3.8e-6 on nemotron_ultra. It is also
# the narrowest result in the study, and `docs/LIMITATIONS.md` §3 says why:
#
#     django__django-11019   10 of 19 discordant pairs
#     django__django-11283    5
#     astropy__astropy-7746   2
#     django__django-11564    2
#
# One task supplies more than half the signal. The effective sample is nearer
# 4 than 19, because five repeats of one bug are not five independent
# observations — McNemar pairs at the TASK level.
#
# Worse, the four tasks were never measured here. They came from the pilot
# (`failure_pool`, "PLAN.md §7 — the 4 genuine logic failures"). "We used four
# tasks from a previous study" is not an answer a reviewer accepts.
#
# ## What a7 changed
#
# a7 ran the `l0_baseline` over all 300 instances in both formats. Scoring
# every `search_replace` baseline attempt: 600 attempts, 23 genuine failures
# (3.8%), 19 distinct tasks, 4 failing on both models. That is a census — the
# Methods section can now state where the tasks came from and why.
#
# 13 tasks for nemotron_ultra, 10 for muse_30b. Against 4 inherited.
#
# ## Design: a3's, with exactly one variable changed
#
# Model, strategies, rounds, repeats, format and thinking are all a3's values.
# **The only thing that differs is the task pool.** That makes this a clean
# replication rather than a new experiment, and it means a disagreement with a3
# can only be attributed to the tasks.
#
# Repeats stay at **5**, not 3. An earlier draft of this plan (D40) traded
# repeats for tasks on the grounds that task count buys independence and
# repeats do not. That reasoning is right and it still applies — but it was
# sized against a projected ~40-task pool. The real pool is 13 and 10, so
# there is quota for both, and keeping 5 preserves the clean comparison with
# a3. What fixes the clustering is going from 4 tasks to 13, not cutting
# repeats.
#
# ## Why `search_replace` only
#
# The pool was measured on `search_replace`, so that is the condition these
# tasks are known to fail. Adding `unified_diff` would add ~87% baseline
# failure (D42: nemotron_ultra applies 2.0% of its unified diffs) and floor
# every cell — a4's exact mistake, where a 0% baseline made recovery
# unmeasurable.
#
# ## Why no `l2_5_diagnose_revise`
#
# D34. Its prompt promises "the REAL, ACTUAL result of running your previous
# patch against the real test suite". Without Docker (D6) that evidence does
# not exist, and the strategy correctly refuses rather than lie to the model.
# It would contribute refusals, not data.
#
# ## Two arms, two pools, reported separately
#
# a3 (550B) found the effect; a2 (30B) found a null; a4 (reasoning) leaned the
# other way. Three arms, three answers, and `LIMITATIONS.md` §3 reports them as
# three rather than averaging into one that describes none of them. Phase 2
# keeps that discipline: `p2_ultra` is the replication that matters, and
# `p2_muse` turns a2's null on 4 tasks into a null on 10, which is worth having
# — a null is only as strong as the sample that failed to reject.
#
# `l0_baseline` is NOT listed: D26 auto-inserts one baseline cell per lineage,
# and listing it would double-count.
# ==========================================================================

grid:
  p2_ultra_recovery:
    enabled: true
    models: [nemotron_ultra]
    tasks: recovery_pool_ultra
    strategies: [l1_blind_retry, l2_reflection]
    edit_formats: [search_replace]
    thinking: [false]
    rounds: 4
    repeats: 5

  p2_muse_recovery:
    enabled: true
    models: [muse_30b]
    tasks: recovery_pool_muse
    strategies: [l1_blind_retry, l2_reflection]
    edit_formats: [search_replace]
    thinking: [false]
    rounds: 4
    repeats: 5
